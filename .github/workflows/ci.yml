name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest --cov=pdfchat --cov-report=term-missing

      - name: Verify the app imports cleanly
        run: python -c "import ast; ast.parse(open('app.py').read())"

      # Runs offline with hashed embeddings, so it costs nothing and cannot
      # flake on a provider outage. It guards the harness and the gold set
      # against regressions, not absolute retrieval quality.
      - name: Retrieval evaluation (offline)
        run: python evals/run_eval.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t pdf-study-assistant:ci .
