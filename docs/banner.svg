<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#15253f"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="8%" r="62%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text{text-anchor:middle}
    .eyebrow{fill:#60a5fa;font-size:13px;font-weight:700;letter-spacing:.18em}
    .title{fill:#f8fafc;font-size:54px;font-weight:800;letter-spacing:-.015em}
    .tag{fill:#94a3b8;font-size:18.5px}
    .pill{fill:#e2e8f0;font-size:13px;font-weight:600}
    .chip{fill:#cbd5e1;font-size:14px}
    .cite{fill:#60a5fa;font-size:14px;font-weight:700}
    .ok{fill:#4ade80;font-size:14px;font-weight:600}
    .foot{fill:#64748b;font-size:12.5px}
  </style>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#rule)"/>

  <text x="640" y="68" class="eyebrow">OPEN SOURCE · SELF-HOSTED · MIT</text>
  <text x="640" y="132" class="title">PDF Study Assistant</text>
  <text x="640" y="172" class="tag">Answers drawn only from your own documents — cited to the page,</text>
  <text x="640" y="198" class="tag">and checked against the sources before you see them.</text>

  <!-- pills: total 580 wide, centred on 640 -->
  <g>
    <rect x="350" y="220" width="146" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="423" y="241" class="pill">Hybrid retrieval</text>
    <rect x="508" y="220" width="128" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="572" y="241" class="pill">Page citations</text>
    <rect x="648" y="220" width="152" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="724" y="241" class="pill">Grounding check</text>
    <rect x="812" y="220" width="118" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="871" y="241" class="pill">Study tools</text>
  </g>

  <!-- the differentiator, as one centred line: a traceable answer -->
  <rect x="268" y="268" width="744" height="42" rx="21" fill="#111c31" stroke="#1e3a5f"/>
  <text x="640" y="294" class="chip">“…takes place in the mitochondria<tspan class="cite"> [S1]</tspan>”<tspan fill="#475569">   ·   </tspan><tspan class="ok">✓ grounded</tspan><tspan fill="#475569">   ·   </tspan>biology.pdf, p. 2</text>

  <text x="640" y="336" class="foot">Claude or GPT · Postgres + pgvector · Docker · 245 tests · measured with a retrieval eval harness</text>
</svg>
