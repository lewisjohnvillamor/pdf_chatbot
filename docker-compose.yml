# Self-hosted stack: the app plus a pgvector-enabled Postgres.
#
#   cp .env.example .env
#   # fill in keys, set VECTOR_STORE=postgres, and generate a DB password:
#   echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)" >> .env
#   docker compose up -d --build
#
# The database port is deliberately not published; only the app reaches it over
# the internal network. Publish it only if you need external psql access.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdfchat}
      # No default on purpose: compose refuses to start rather than run the
      # database with a password that is published in this repository.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - generate one with `openssl rand -base64 24`}"
      POSTGRES_DB: ${POSTGRES_DB:-pdfchat}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once on first start of an empty data directory.
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdfchat} -d ${POSTGRES_DB:-pdfchat}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      # Overrides .env so the app always finds the service on the compose network.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pdfchat}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-pdfchat}"
      CACHE_DIR: /data/cache
    volumes:
      - appcache:/data
    depends_on:
      db:
        condition: service_healthy
    # Defence in depth: the app writes only to its cache volume.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  appcache:
